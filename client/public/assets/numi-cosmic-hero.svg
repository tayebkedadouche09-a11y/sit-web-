<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">NUMI digital universe</title><desc id="desc">A cinematic deep-space scene with stars, nebula light and floating digital architecture.</desc>
<defs>
 <radialGradient id="bg"><stop stop-color="#173e72"/><stop offset=".48" stop-color="#07182d"/><stop offset="1" stop-color="#020714"/></radialGradient>
 <radialGradient id="neb" cx=".72" cy=".45"><stop stop-color="#4d9dff" stop-opacity=".45"/><stop offset=".45" stop-color="#6d4cff" stop-opacity=".18"/><stop offset="1" stop-color="#020714" stop-opacity="0"/></radialGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a8d4ff" stop-opacity=".26"/><stop offset="1" stop-color="#0b1b30" stop-opacity=".72"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="34"/></filter>
 <filter id="glow"><feGaussianBlur stdDeviation="8"/></filter>
 <pattern id="grid" width="70" height="70" patternUnits="userSpaceOnUse"><path d="M70 0H0V70" fill="none" stroke="#83c2ff" stroke-opacity=".08"/></pattern>
</defs>
<rect width="1600" height="1000" fill="url(#bg)"/>
<ellipse cx="1180" cy="410" rx="500" ry="360" fill="url(#neb)" filter="url(#blur)"/>
<ellipse cx="300" cy="780" rx="360" ry="180" fill="#ef8b65" opacity=".10" filter="url(#blur)"/>
<rect width="1600" height="1000" fill="url(#grid)"/>
<g fill="#d9edff">
 <circle cx="92" cy="118" r="2"/><circle cx="180" cy="310" r="1.5"/><circle cx="280" cy="90" r="1.5"/><circle cx="430" cy="220" r="2"/>
 <circle cx="560" cy="110" r="1.2"/><circle cx="690" cy="310" r="1.6"/><circle cx="790" cy="155" r="1.2"/><circle cx="930" cy="88" r="1.8"/>
 <circle cx="1030" cy="245" r="1.3"/><circle cx="1260" cy="120" r="1.8"/><circle cx="1410" cy="330" r="1.4"/><circle cx="1510" cy="170" r="2"/>
 <circle cx="1190" cy="620" r="1.5"/><circle cx="1370" cy="740" r="2"/><circle cx="1520" cy="570" r="1.2"/><circle cx="1040" cy="850" r="1.6"/>
</g>
<!-- abstract Algerian arch -->
<path d="M1120 760V430c0-175 115-290 280-290s280 115 280 290v330" fill="none" stroke="#83c2ff" stroke-opacity=".20" stroke-width="3"/>
<path d="M1170 760V450c0-145 92-235 230-235s230 90 230 235v310" fill="none" stroke="#ef8b65" stroke-opacity=".16" stroke-width="2"/>
<!-- floating browser -->
<g transform="translate(900 270) rotate(-8)">
 <rect width="510" height="330" rx="28" fill="url(#glass)" stroke="#9acaff" stroke-opacity=".35" stroke-width="2"/>
 <circle cx="32" cy="32" r="6" fill="#ef8b65"/><circle cx="54" cy="32" r="6" fill="#d5bf58"/><circle cx="76" cy="32" r="6" fill="#5cc98a"/>
 <rect x="28" y="72" width="160" height="20" rx="10" fill="#83c2ff" opacity=".18"/>
 <rect x="28" y="116" width="205" height="150" rx="18" fill="#1652a1" opacity=".82"/>
 <rect x="255" y="116" width="225" height="65" rx="18" fill="#2d7ff9" opacity=".42"/>
 <rect x="255" y="200" width="105" height="66" rx="18" fill="#ffffff" opacity=".10"/>
 <rect x="375" y="200" width="105" height="66" rx="18" fill="#ffffff" opacity=".08"/>
</g>
<g transform="translate(1080 650) rotate(6)">
 <rect width="310" height="190" rx="24" fill="#07182b" stroke="#83c2ff" stroke-opacity=".28"/>
 <rect x="24" y="28" width="90" height="12" rx="6" fill="#83c2ff" opacity=".30"/>
 <rect x="24" y="64" width="120" height="78" rx="14" fill="#1652a1"/>
 <rect x="162" y="64" width="124" height="34" rx="12" fill="#ef8b65" opacity=".30"/>
 <rect x="162" y="108" width="124" height="34" rx="12" fill="#ffffff" opacity=".08"/>
</g>
<path d="M80 910C350 810 530 910 720 850s360-90 800 40" fill="none" stroke="#83c2ff" stroke-opacity=".18" stroke-width="2"/>
</svg>